<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Видео-Секундомера</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-field label {
            font-size: 0.75rem;
            color: #6b7280;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .input-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
        }

        .input-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .info-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            line-height: 1.4;
        }

        .info-box.warning {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .info-box.success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.1s linear;
        }

        #previewCanvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Генератор Секундомера</h1>
    
    <div class="input-group">
        <div class="input-field">
            <label>Чч</label>
            <input type="number" id="hrs" min="0" value="0">
        </div>
        <div class="input-field">
            <label>Мм</label>
            <input type="number" id="mins" min="0" max="59" value="2">
        </div>
        <div class="input-field">
            <label>Сс</label>
            <input type="number" id="secs" min="0" max="59" value="0">
        </div>
        <div class="input-field">
            <label>Мс</label>
            <input type="number" id="ms" min="0" max="999" value="0">
        </div>
    </div>

    <button id="startBtn">Сгенерировать видео</button>

    <div id="infoBox" class="info-box"></div>

    <div class="progress-container" id="progressContainer">
        <p style="font-size: 0.85rem; margin-bottom: 5px; text-align: center;" id="progressText">Подготовка...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<canvas id="previewCanvas" width="1280" height="720"></canvas>

<script>
const startBtn = document.getElementById('startBtn');
const infoBox = document.getElementById('infoBox');
const progressContainer = document.getElementById('progressContainer');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');

startBtn.addEventListener('click', async () => {
    const hrs = parseInt(document.getElementById('hrs').value) || 0;
    const mins = parseInt(document.getElementById('mins').value) || 0;
    const secs = parseInt(document.getElementById('secs').value) || 0;
    const ms = parseInt(document.getElementById('ms').value) || 0;

    const totalMs = (hrs * 3600 + mins * 60 + secs) * 1000 + ms;

    if (totalMs <= 0) {
        alert('Пожалуйста, укажите время больше 0');
        return;
    }

    const totalMinutes = totalMs / 1000 / 60;
    let speedMultiplier = 1;
    let infoMessage = "";

    if (totalMinutes < 5) {
        speedMultiplier = 1;
        infoMessage = "Время меньше 5 минут. Видео будет в оригинальной скорости.";
        infoBox.className = "info-box success";
    } else if (totalMinutes < 10) {
        speedMultiplier = 2;
        infoMessage = `Время меньше 10 минут. Видео ускорено в 2 раза для экономии места. (Длительность файла: ${(totalMinutes / 2).toFixed(1)} мин.)`;
        infoBox.className = "info-box warning";
    } else if (totalMinutes <= 20) {
        speedMultiplier = 4;
        infoMessage = `Время меньше 20 минут. Видео ускорено в 4 раза для экономии места. (Длительность файла: ${(totalMinutes / 4).toFixed(1)} мин.)`;
        infoBox.className = "info-box warning";
    } else {
        alert('Максимальная длительность для генерации в браузере — 20 минут.');
        return;
    }

    infoBox.innerText = infoMessage;
    infoBox.style.display = "block";
    
    startBtn.disabled = true;
    progressContainer.style.display = "block";

    const fps = 30; 
    const frameDuration = 1000 / fps; 
    const timeStepPerFrame = frameDuration * speedMultiplier; 

    // Захватываем поток из canvas
    const stream = canvas.captureStream(fps);
    
    // Используем нативный MediaRecorder (поддерживается всеми смартфонами и ПК)
    let options = { mimeType: 'video/webm; codecs=vp9' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/mp4' };
    }
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
    }

    const recordedChunks = [];
    const mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        // Даем расширение mp4 или webm в зависимости от того, что записал браузер
        const ext = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
        a.download = `stopwatch_${hrs}h_${mins}m_${secs}s.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        startBtn.disabled = false;
        progressText.innerText = "Готово! Файл скачивается.";
        progressFill.style.width = "100%";
    };

    // Запускаем запись
    mediaRecorder.start();

    let currentVirtualMs = 0;

    function drawFrame(msCount) {
        ctx.fillStyle = '#0f172a'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let displayMs = msCount % 1000;
        let totalSeconds = Math.floor(msCount / 1000);
        let displaySecs = totalSeconds % 60;
        let totalMins = Math.floor(totalSeconds / 60);
        let displayMins = totalMins % 60;
        let displayHrs = Math.floor(totalMins / 60);

        const sHrs = String(displayHrs).padStart(2, '0');
        const sMin = String(displayMins).padStart(2, '0');
        const sSec = String(displaySecs).padStart(2, '0');
        const sMs = String(Math.floor(displayMs / 10)).padStart(2, '0'); 

        const timeString = `${sHrs}:${sMin}:${sSec}.${sMs}`;

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 90px monospace'; // Оптимальный размер для разрешения 1280x720
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(timeString, canvas.width / 2, canvas.height / 2);

        if (speedMultiplier > 1) {
            ctx.fillStyle = '#ef4444';
            ctx.font = '30px sans-serif';
            ctx.fillText(`Ускорение: x${speedMultiplier}`, canvas.width / 2, canvas.height / 2 + 100);
        }
    }

    // Рендеринг
    async function generate() {
        const totalFrames = Math.ceil(totalMs / timeStepPerFrame);
        let frameCount = 0;

        while (currentVirtualMs <= totalMs) {
            drawFrame(currentVirtualMs);
            
            frameCount++;
            currentVirtualMs += timeStepPerFrame;

            // Обновляем прогресс-бар на экране
            const percent = Math.min(100, (frameCount / totalFrames) * 100);
            progressFill.style.width = `${percent}%`;
            progressText.innerText = `Отрисовка кадров: ${Math.floor(percent)}%`;

            // Ждем один физический кадр, чтобы MediaRecorder успел его «съесть» из Canvas
            await new Promise(resolve => setTimeout(resolve, 1000 / fps));
        }

        // Пишем финальную точку
        drawFrame(totalMs);
        await new Promise(resolve => setTimeout(resolve, 1000 / fps));

        // Останавливаем запись
        mediaRecorder.stop();
    }

    generate();
});
</script>

</body>
</html>
